buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["FaceRecognitionSdk_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["FaceRecognitionSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["FaceRecognitionSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.facerecognitionsdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

// This build only assembles :app, so the plugin's own AAR is never built and the
// local-.aar rule never bites here. A consumer that assembles every module — Capacitor's
// `cap run android` does — would hit it on the files() fallback, so the task is turned off:
// nothing consumes this module's AAR, the app includes it as a Gradle project.
tasks.configureEach { task ->
  if (task.name ==~ /bundle(Debug|Release)Aar/) {
    task.enabled = false
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

def bundledAar = file("${projectDir}/libs/facerecognitionsdk.aar")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // The :libfacesdk module comes first. A library module may not depend on a local .aar file
  // directly: AGP fails bundleDebugAar with "Direct local .aar file dependencies are not
  // supported when building an AAR", because the engine's classes and resources would be left
  // out of the plugin's own AAR. The wrapper module (example/android/libfacesdk, via
  // settings.gradle) hands the same file over as a real Gradle artifact instead.
  if (findProject(':libfacesdk') != null) {
    implementation project(path: ':libfacesdk')
  } else if (bundledAar.exists()) {
    // Prefer files() over flatDir — flatDir has no POM metadata and fails
    // resolution for :app > :face-recognition-sdk on AGP 8+.
    implementation files(bundledAar)
  } else {
    throw new GradleException(
      "Missing facerecognitionsdk.aar.\n" +
      "Place it at android/libs/facerecognitionsdk.aar (or example/android/libfacesdk/ for the demo)."
    )
  }
}

